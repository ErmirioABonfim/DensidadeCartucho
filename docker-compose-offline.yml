# ============================================================
# Docker Compose para Ambiente OFFLINE
# Não faz build, apenas usa imagem pré-carregada
# ============================================================
version: '3.8'

services:
  # ===================
  # LINHA 01
  # ===================
  density-predictor-l01:
    container_name: density_predictor_L01
    image: density-predictor:1.0
    # SEM build - usa imagem já carregada
    restart: unless-stopped
    volumes:
      - ./models:/app/models_volume:ro
    env_file:
      - ./L01/app/.env

